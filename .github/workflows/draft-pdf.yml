
name: Draft JOSS PDF

on:
  push:
    branches:
      - cross-border-development
    paths:
      - "ireland_ni_crossborder_analysis/paper.md"
      - "ireland_ni_crossborder_analysis/paper.bib"
      - ".github/workflows/draft-pdf.yml"
  workflow_dispatch:

jobs:
  paper:
    runs-on: ubuntu-latest
    name: Compile JOSS paper

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: ireland_ni_crossborder_analysis/paper.md

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: joss-paper
          path: ireland_ni_crossborder_analysis/paper.pdf
          if-no-files-found: error
